name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Test
        run: pytest --tb=short -q

  nginx-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install and build
        run: |
          pip install -e .
          flydocs build

      - name: Serve with Nginx and verify
        run: |
          docker run -d --name flydocs-nginx -p 8080:80 \
            -v $PWD/public:/usr/share/nginx/html:ro nginx:alpine
          sleep 2
          curl -sf http://localhost:8080/ | grep "flydocs"
          curl -sf http://localhost:8080/okf/ | grep "OKF"
          curl -sf http://localhost:8080/configuration/ | grep "Configuration"
          curl -sf http://localhost:8080/patternfly/ | grep "PatternFly"
          curl -sf http://localhost:8080/assets/css/flydocs.css | grep "flydocs-masthead"
          curl -sf http://localhost:8080/assets/js/flydocs.js | grep "initTheme"
          echo "All Nginx smoke tests passed"

      - name: Cleanup
        if: always()
        run: docker rm -f flydocs-nginx || true
