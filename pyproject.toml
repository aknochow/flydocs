[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flydocs"
dynamic = ["version"]
description = "Static documentation sites with PatternFly from markdown."
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{ name = "Adam Knochowski", email = "aknochow@redhat.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.0",
    "markdown>=3.4",
    "tomli>=2.0;python_version<'3.11'",
    "Jinja2>=3.1",
    "Pygments>=2.15",
    "pagefind",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "pre-commit"]

[project.scripts]
flydocs = "flydocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flydocs = ["templates/*.html", "assets/**/*"]

[tool.setuptools-scm]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
