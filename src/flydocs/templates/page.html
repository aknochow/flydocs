<!DOCTYPE html>
<html lang="en" data-palette="{{ palette }}"{{ theme_class }}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ tab_title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="icon" href="{{ base_path }}/{{ favicon_path }}" type="image/svg+xml">
{% if google_fonts %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&family=Red+Hat+Mono:wght@300..700&display=swap">
{% endif %}
  <link rel="stylesheet" href="{{ base_path }}/assets/css/patternfly-base.css">
  <link rel="stylesheet" href="{{ base_path }}/assets/css/flydocs.css">
</head>
<body>
{% if banner_html %}
  {{ banner_html }}
{% endif %}

  <header class="flydocs-masthead">
    <button class="flydocs-toggle" id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
    <div class="flydocs-brand-group">
{% if logo %}
      <a href="{{ base_path }}/" class="flydocs-brand">
        <img src="{{ base_path }}/{{ logo }}" alt="{{ project_name }}" style="height: 28px;">
      </a>
{% else %}
      <a href="{{ base_path }}/" class="flydocs-brand">{{ project_name }}</a>
{% endif %}
{% if tagline %}
      <span class="flydocs-tagline">{{ tagline }}</span>
{% endif %}
    </div>
    {{ badges }}
{% if theme_mode == "auto" %}
    <button class="flydocs-theme-toggle" id="theme-toggle" aria-label="Toggle theme">☾</button>
{% endif %}
  </header>

  <div id="backdrop" class="flydocs-backdrop"></div>

  <div class="flydocs-layout">
    <aside class="flydocs-sidebar" id="sidebar">
      {{ sidebar }}
    </aside>

    <main class="flydocs-main">
      <div class="flydocs-content pf-v6-c-content">
        {{ content }}
      </div>
      <footer class="flydocs-footer">
        Built with <a href="https://github.com/aknochow/flydocs">flydocs</a>
      </footer>
    </main>
  </div>

  <script src="{{ base_path }}/assets/js/flydocs.js"></script>
</body>
</html>
